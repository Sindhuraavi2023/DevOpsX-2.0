services:
  devopsx-app:
    build: .
    container_name: devopsx-compose-app
    ports:
      - "5000:5000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: devopsx-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - devopsx-app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: devopsx-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: devopsxadmin
    depends_on:
      - prometheus
    restart: unless-stopped