
global:
  scrape_interval: 5s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "devopsx-flask-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["devopsx-app:5000"]

  - job_name: "devopsx-kubernetes-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:30080"]
